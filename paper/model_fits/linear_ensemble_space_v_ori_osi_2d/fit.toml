compact = { extents = [292.4, 258.3] }
# Note: a, b here are calculated with the formulae a = a1 - a0 + 1, b = b1 - b0 + 1
# where a0 = 0.98, b0 = 1.28 are the parameters of the distribution of OSI of all neurons,
# and a1, b1 are the parameters of the Beta distribution of OSI of perturbed neurons.
# An extra filtering step is needed for untuned ensembles because this procedure for generating
# ensembles has a bias towards more cotuned ensembles, and the bias is particular severe for
# the untuned ensemble generation.
low = { a = 0.95, b = 1.22, k0 = -3.7, k1 = 10.0, k2 = -9.8, cond = "ensemble_osi(x).item() < 0.07" }  # a1 = 0.93, b1 = 1.5
high = { a = 1.32, b = 0.66, k0 = -7.3, k1 = 19.0, k2 = -12.0 }  # a1 = 1.3, b1 = 0.94

