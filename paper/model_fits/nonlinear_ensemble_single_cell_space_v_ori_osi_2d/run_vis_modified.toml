[dataset]
__ref__ = ["fit.toml", "validation_dataset"]

[dataset.neurons]
__ref__ = ["fit.toml", "validation_dataset", "neurons"]

[[dataset.perturbations.configs.__matrix__]]
expr = ["""
contrast * hmax * torch.exp(-dspace.norm(dim=-1)**2 / (2 * 200.0**2)) * \
2 * torch.pi * special.von_mises(torch.exp(-4.6 + 11.0 * osi - 6.1 * osi**2), dori) * \
special.beta(1.32, 0.78, osi)\
"""]
contrast = [0.01, 0.03, 0.1, 0.3, 1.0]
stim_size = [0, 5, 15, 25, 35, 45, 55, 65, 75, 85]
cell_probs = [{ PYR = 0.610, PV = 0.617 }]

[dataset.perturbations.mapping]
__call__ = ["builtins", "dict", [[0, { hmax = 0 }], [5, { hmax = 0.3 }], [15, { hmax = 1.0 }], [25, { hmax = 1.15 }], [35, { hmax = 0.8 }], [45, { hmax = 0.5 }], [55, { hmax = 0.1 }], [65, { hmax = 0.08 } ], [75, { hmax = 0.06 }], [85, { hmax = 0.04 }] ]]

[dataset.metrics]
distance = "radius"
rel_ori = "abs_ori"

[state_dict]
__call__ = ["niarb.io", "load_state_dict"]
weights_only = true
map_location = "cpu"
modify = { dh = [[[], 1.0]], vf = [[["PYR"], "vf[0]**0.5"]] }

[state_dict.path]
__call__ = ["niarb.io", "iterdir"]
path = "fits"
pattern = "*.pt"
indices = { __call__ = ["builtins", "int", { __environ__ = "SLURM_ARRAY_TASK_ID" }] }

