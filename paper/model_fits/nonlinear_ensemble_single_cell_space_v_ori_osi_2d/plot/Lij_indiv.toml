tag_names = ["path", "loss"]

[dataframes.__matrix__]
path = { __call__ = ["niarb.io", "iterdir"], path = { __format__ = "runs/linear_approx_more" }, pattern = "*.pkl", indices = { __indices__ = { __environ__ = "INDICES" } } }

[[dataframes.__include__]]
loss = { __eval__ = "float(path.stem)" }
func = ["niarb.io", "load_data"]
paths = { __eval__ = "path" }
# query = "distance < 75"
columns = { Lij = "dr / dh.max()" }  # dri = Lij * gj * dhj and gj = 1 ==> Lij = dri / dhj

[plots.__matrix__]
# x = ["Lij"]
y = ["Lij"]

[[plots.__include__]]
name = { __eval__ = "y" }
func = "catplot"
kind = "bar"
x = "cell_type"
order = ["PYR", "PV", "SST", "VIP"]
col = "loss"
row = "perturbed_cell_type"
row_order = ["PYR", "PV", "SST", "VIP"]
errorbar = "se"
grid = "yzero"
height = "paper"
aspect = 1.2
rc_params = "paper"
sharey = "col"

[plots.__include__.mapping]
Lij = '$L_{ij}$'
perturbed_cell_type = "j"
cell_type = "i"
loss = "Loss"

