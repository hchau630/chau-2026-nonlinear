tag_names = ["path", "loss"]

[dataframes.__matrix__]
path = { __call__ = ["niarb.io", "iterdir"], path = { __format__ = "runs/{MODE}" }, pattern = "*.pkl", indices = { __indices__ = { __environ__ = "INDICES" } } }

[[dataframes.__include__]]
loss = { __eval__ = "float(path.stem)" }
func = ["niarb.io", "load_data"]
paths = { __eval__ = "path" }
query = "N == 10"

[plots]
__ignore__ = ["subset"]

[plots.__matrix__]
x = ["dr"]
subset = ["nearby", "nearby_all", "all"]

[[plots.__include__]]
name = { __eval__ = "f'{x}_{subset}'" }
func = "displot"
groupby = ["density", "holo_osi"]
hue = "cell_type"
hue_order = ["PYR", "PV", "SST", "VIP"]
estimator = "mean"
element = "step"
fill = false
common_bins = false
common_norm = false
stat = "density"
# outliers = [0.001, 1]
# outliers = [0.01, 1]
grid = "yzero"
# height = "paper"
height = 1.2
aspect = 1.1
rc_params = "paper"
title_verbosity = 0
# tight_layout = false
# facet_kws = { sharey = false, sharex = false }
# facet_kws = { sharey = false }
# errordim = "instance_idx"
# errorbar = "se"
# err_kws = { linewidth = 0.5 }

[plots.__include__.mapping]
# dv = '$\Delta$ rec. input'
dv = '$\delta v_j$ (mV)'
dr = "Response (ΔF/F)"
Hdv2 = '$H_{jj}\delta v_j^2$ (Hz)'
distance = 'Distance ($\mu$m)'
rel_ori = '$\Delta$ ori. pref. (deg)'
cell_type = "Cell type"
density = "Density"
holo_osi = "Ens. OSI"

[plots.__include__.replace]
spreadout = "Diffuse"
compact = "Compact"
low = "Untuned"
high = "Cotuned"
model = "Model"
data = "Data"

[[plots.__include__]]
x = "dr"
facet_kws = { sharey = false, sharex = false }
outliers = [0.001, 0.999]

[[plots.__include__]]
subset = "nearby"
query = "distance > 15 and distance < 75"

[[plots.__include__]]
subset = "nearby_all"
query = "distance < 75"

