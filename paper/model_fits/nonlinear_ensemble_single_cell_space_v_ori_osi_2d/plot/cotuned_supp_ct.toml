tag_names = ["path", "loss"]

[dataframes.__matrix__]
path = { __call__ = ["niarb.io", "iterdir"], path = { __format__ = "runs/{MODE}" }, pattern = "*.pkl", indices = { __indices__ = { __environ__ = "INDICES" } } }

[[dataframes.__include__]]
loss = { __eval__ = "float(path.stem)" }
func = ["niarb.io", "load_data"]
paths = { __eval__ = "path" }
min_instances = 9
query = "N == 10 and distance > 15 and distance < 75 and cell_type != 'PYR'"
pivot_table = { index = ["loss", "cell_type", "density"], columns = "holo_osi", values = "dr" }
columns = { ddr = "high - low" }

[[plots]]
name = { __environ__ = "MODE" }
func = "catplot"
kind = "strip"
x = "cell_type"
order = ["PV", "SST", "VIP"]
y = "ddr"
col = "density"
col_order = ["spreadout", "compact"]
grid = "yzero"
# height = "paper"
height = 1.2
aspect = 1
rc_params = "paper"
title_verbosity = 0
legend_title = false
sharey = false
# errorbar = "se"
s = 4
color = "black"
statannot = true
statannot_kws = { kind = "1samp", test = "wilcoxon" }

[plots.mapping]
# dr = "Response (ΔF/F)"
# distance = 'Distance ($\mu$m)'
# rel_ori = '$\Delta$ ori. pref. (deg)'
ddr = "Cotuned - Untuned (ΔF/F)"
cell_type = "Cell type"
density = "Density"
# holo_osi = "Ens. Tuning"

[plots.replace]
spreadout = "Diffuse"
compact = "Compact"
# low = "Untuned"
# high = "Cotuned"

