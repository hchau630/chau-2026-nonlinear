tag_names = ["path", "loss"]

[dataframes.__matrix__]
path = { __call__ = ["niarb.io", "iterdir"], path = { __format__ = "runs/{MODE}" }, pattern = "*.pkl", indices = { __indices__ = { __environ__ = "INDICES" } } }

[[dataframes.__include__]]
loss = { __eval__ = "float(path.stem)" }
func = ["niarb.io", "load_data"]
paths = { __eval__ = "path" }

[plots]
__ignore__ = ["N", "axes"]

[plots.__matrix__]
N = [1, 10]
# axes = ["mean_nearby", "space", "ori", "space_ori"]
axes = ["mean_nearby", "space", "space_ori"]

[[plots.__include__]]
name = { __eval__ = "f'resp_{N}_{axes}'" }
func = "relplot"
kind = "line"
groupby = "loss"
y = "dr"
col = "instance_idx"
grid = "yzero"
height = "paper"
rc_params = "paper"
title_verbosity = 0
legend_title = false
facet_kws = { sharey = "row" }
errordim = "stim_idx"
errorbar = "se"
# err_kws = { linewidth = 0.5 }

[plots.__include__.mapping]
dr = "Response (ΔF/F)"
distance = 'Distance ($\mu$m)'
rel_ori = '$\Delta$ ori. pref. (deg)'
cell_type = "Cell type"
density = "Density"
holo_osi = "Ens. OSI"
instance_idx = "Instance index"

[plots.__include__.replace]
spreadout = "Diffuse"
compact = "Compact"
low = "Untuned"
high = "Cotuned"
model = "Model"
data = "Data"

[[plots.__include__]]
N = 1
query = "distance > 15 and N == 1"

[[plots.__include__]]
N = 10
query = "distance > 15 and N == 10"
row = "density"
row_order = ["spreadout", "compact"]

[[plots.__include__]]
axes = "mean_nearby"
func = "catplot"
kind = "bar"
sharey = false
facet_kws = {}

[[plots.__include__]]
axes = "space"
cuts = { distance = { __array__ = "15:151:15.0" } }
groupby = ["loss", "cell_type"]
x = "distance"

[[plots.__include__]]
axes = "space_ori"
cuts = { distance = { __array__ = "15:151:15.0" }, rel_ori = [0, 22.5, 67.5, 90.0] }
groupby = ["loss", "cell_type"]
x = "distance"
hue = "rel_ori"
palette = ["#93B8E2", "#46BC99", "#F69CA0"]
tight_layout = false

[[plots.__include__]]
N = 1
axes = "mean_nearby"
query = "N == 1 and distance > 15 and distance < 75"
x = "cell_type"
aspect = 0.8

[[plots.__include__]]
N = 10
axes = "mean_nearby"
query = "N == 10 and distance > 15 and distance < 75"
x = "density"
order = ["spreadout", "compact"]
hue = "holo_osi"
hue_order = ["low", "high"]
row = "cell_type"
row_order = ["PYR", "PV", "SST", "VIP"]
statannot = true
statannot_kws = { test = "ttest_ind", test_kws = { alternative = "greater", equal_var = false, permutations = 999999 } }
aspect = 1.0

[[plots.__include__]]
N = 1
axes = "space"
aspect = 1.0

[[plots.__include__]]
N = 10
axes = "space"
hue = "holo_osi"
hue_order = ["low", "high"]
aspect = 1.0

[[plots.__include__]]
N = 1
axes = "space_ori"
aspect = 1.0

[[plots.__include__]]
N = 10
axes = "space_ori"
groupby = ["loss", "holo_osi", "cell_type"]
aspect = 1.1

