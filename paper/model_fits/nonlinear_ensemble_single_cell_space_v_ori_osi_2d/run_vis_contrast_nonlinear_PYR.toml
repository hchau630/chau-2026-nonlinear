simulation_kwargs = { options = { max_num_steps = 100000 } }

[pipeline.scaler]
__call__ = ["niarb.nn", "NamedSequential"]

[pipeline.scaler.modules.scaler]
__call__ = ["niarb.nn.modules.pipeline", "Scaler"]

[pipeline.scaler.modules.vis_rel_delta_rate]
__call__ = ["niarb.nn.modules.vis", "VisRelDeltaRate"]
a_optim = false
s_optim = false
k_optim = false
# From Mossing et al. (20221) Figure 1. Values obtained with command
# `python process_mossing_data.py mossing_data -t`
a_init = [
    [0.0000, 0.0000,  0.0000,  0.0000],
    [0.4487, 0.6106,  0.9134,  0.1210],
    [0.5344, 0.7392,  2.7259, -0.5554],
    [0.5255, 0.5612,  5.3720, -0.6451],
    [0.5090, 0.3345,  8.1242, -0.4052],
    [0.9839, 0.7696, 11.6645, -0.5821],
]
# From Di Santo et al. (2025) Figure S6, regression of rate field width against size
# is approximately:
# PYR: σ = 22.3 deg at size = 0 deg, σ = 36.5 deg at size = 100 deg => 26.6 deg at size = 30 deg
# PV:  σ = 20.7 deg at size = 0 deg, σ = 20.7 deg at size = 100 deg => 20.7 deg at size = 30 deg
# SST: σ = 10.7 deg at size = 0 deg, σ = 21.0 deg at size = 100 deg => 13.8 deg at size = 30 deg
# VIP: σ = 22.4 deg at size = 0 deg, σ = 22.4 deg at size = 100 deg => 22.4 deg at size = 30 deg
# This is then multiplied by 31.6 μm/deg, since the cortical magnification factor of mouse V1 is
# roughly 0.001 mm^2/deg^2 (Beest et al. 2021).
s_init = [840.6, 654.1, 436.1, 707.8]
# Neill and Stryker (2008) showed contrast-invariance of tuning curves in mouse V1, though
# layer and cell types are not identified. On the contrary, Li et al. (2012) showed contrast-
# dependent tuning in mouse V1, though it was in L4. For simplicity we assume contrast-invariance
# for PYR, PV, and SST. VIP, on the other hand, seems less orientation-tuned at high-contrast
# (Millman et al. 2021), so we just somewhat arbitrarily decrease kappa with contrast. Also,
# because VIP are suppressed, we need to flip the sign of kappa.
k_init = [
    [0.0, 0.0, 0.0,  0.0], # 0% contrast
    [0.5, 0.5, 0.5, -0.5], # 6% contrast
    [0.5, 0.5, 0.5, -0.3], # 12% contrast
    [0.5, 0.5, 0.5, -0.2], # 25% contrast
    [0.5, 0.5, 0.5, -0.1], # 50% contrast
    [0.5, 0.5, 0.5, -0.05], # 100% contrast
]
cell_types = ["PYR", "PV", "SST", "VIP"]
batch_coords = { contrast = [0, 6, 12, 25, 50, 100] }
