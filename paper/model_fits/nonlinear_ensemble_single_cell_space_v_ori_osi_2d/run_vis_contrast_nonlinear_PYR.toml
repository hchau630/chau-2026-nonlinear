# model_kwargs = { newton_kwargs = { bounds = [-10.0, 4.0] } }

[[dataset.perturbations.configs.__matrix__]]
N = [10]
expr = ["""
special.uniform(extents, dspace).prod(dim=-1) * \
special.von_mises(torch.exp(k0 + k1 * osi + k2 * osi**2), dori) * \
special.ubeta(a, b, osi)\
"""]
cell_probs = [{ PYR = 1.0 }]
# density = ["spreadout", "compact"]
# holo_osi = ["low", "high"]
density = ["compact"]
holo_osi = ["high"]
affine_ori = [true]
# value = [0.0001]
# value = [0.001]
# value = [0.01]
repeats = [5]

[dataset.perturbations.mapping]
compact = { extents = [292.5, 258.0] }
high = { a = 1.32, b = 0.78, k0 = -4.6, k1 = 11.0, k2 = -6.1 }

[dataset.metrics]
distance = "min_distance_to_ensemble"
rel_ori = "abs_relative_ori"
signed_rel_ori = "signed_relative_ori"
radius = "radius"
abs_ori = "abs_ori"

[pipeline.model]
