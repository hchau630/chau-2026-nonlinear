tag_names = ["kind", "loss"]

[dataframes.__matrix__]
kind = { __call__ = ["json", "loads", { __environ__ = "MODES" } ] }
loss = { __call__ = ["niarb.io", "iterdir"], path = { __format__ = "fits" }, pattern = "*.pt", stem = true, indices = { __indices__ = { __environ__ = "INDICES" } } }

[[dataframes.__include__]]
func = ["niarb.io", "load_data"]
paths = { __eval__ = "f'runs/{kind}/{loss}.pkl'" }
query = "N == 10"

[plots]
__ignore__ = ["axes"]

[plots.__matrix__]
# axes = ["mean", "mean_unperturbed", "space", "ori", "space_ori"]
axes = ["mean_nearby", "space", "ori"]

[[plots.__include__]]
name = { __eval__ = "f'resp_{axes}'" }
groupby = ["loss", "cell_type"]
func = "relplot"
kind = "line"
y = "dr"
col = "density"
col_order = ["spreadout", "compact"]
hue = "holo_osi"
hue_order = ["low", "high"]
grid = "yzero"
height = "paper"
aspect = 0.9
rc_params = "paper"
title_verbosity = 0
# legend_title = false
# facet_kws = { sharey = false }
errordim = "instance_idx"
errorbar = "se"
# err_kws = { linewidth = 0.5 }

[plots.__include__.mapping]
dr = "Response (ΔF/F)"
distance = 'Distance ($\mu$m)'
rel_ori = '$\Delta$ ori. pref. (deg)'
cell_type = "Cell type"
density = "Density"
holo_osi = "Ens. Tuning"
# kind = "Mode"
kind = "Order"

[plots.__include__.replace]
spreadout = "Diffuse"
compact = "Compact"
low = "Untuned"
high = "Cotuned"
numerical = "Simulation"
linear_approx = "Linear"
second_order_approx = "2nd order"
quasi_linear_approx = "(1)"
second_order_approx_2-1 = "(2,1)"
second_order_approx_2-2 = "(2,2)"
second_order_approx_2-2_linear_PV = "(2,2,E)"
second_order_approx_2-2_linear_PYR = "(2,2,I)"
matrix_linear_approx = "Linear"
matrix_second_order_approx = "2nd order"
matrix_quasi_linear_approx = "(1)"
matrix_second_order_approx_2-1 = "(2,1)"
matrix_second_order_approx_2-2 = "(2,2)"
matrix_second_order_approx_2-2_linear_PV = "(2,2,E)"
matrix_second_order_approx_2-2_linear_PYR = "(2,2,I)"

