[[plots.__include__]]
axes = "mean_nearby"
func = "catplot"
kind = "bar"
query = "distance > 15 and distance < 75"
x = "kind"
order = { __call__ = ["json", "loads", { __environ__ = "MODES" } ] } 
# grid = { __const__ = "None" }
# facet_kws = {}
# tick_params = { axis = "x", bottom = false, labeltop = true, labelbottom = false }
# tick_params = { axis = "x", labelrotation = 30 }
# despine = { bottom = true, top = false }
# spine_positions = { top = "zero" }
statannot = true
statannot_kws = { test = "ttest_ind", test_kws = { alternative = "greater", equal_var = false, permutations = 999999 } }
aspect = 1.0

[[plots.__include__]]
axes = "space"
query = "distance > 15"
cuts = { distance = { __array__ = "15:151:15.0" } }
x = "distance"
style = "kind"
style_order = { __call__ = ["json", "loads", { __environ__ = "MODES" } ] }

[[plots.__include__]]
axes = "ori"
query = "distance > 15"
cuts = { distance = { __array__ = "15:151:15.0" }, rel_ori = { __array__ = "-5:96:10" } }
x = "rel_ori"
style = "kind"
style_order = { __call__ = ["json", "loads", { __environ__ = "MODES" } ] }

