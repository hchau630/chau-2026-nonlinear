[build-system]
# Editable installs with setuptools are supported starting with v64.0.0.
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "niarb"
version = "0.1.0"
description = "Code for fitting firing rate models of mouse V1 used in my projects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ho Yin Chau" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy",
    "scipy >= 1.14.0",        # Need the axis argument in scipy.stats.pearsonr.
    "pandas",
    "seaborn",
    "statsmodels > 0.14.5",   # 0.14.4 or earlier breaks with scipy >= 1.16.0.
    "matplotlib",
    "torch >= 2.2.0",         # torch.bucketize is implemented for MPS starting in 2.2.0.
    "torchdiffeq",
    "hyclib >= 0.1.40",
    "tdfl >= 0.1.15",
    "tqdm",
    "ricciardi >= 0.1.6",
    "torch-bessel >= 0.0.10",
    "xitorch",                # Solves steady-state equations with established numerical methods.
]

# Select PyTorch build
[project.optional-dependencies]
pt26cpu = ["torch == 2.6.0", "torch-bessel"]
pt26cu124 = ["torch == 2.6.0", "torch-bessel"]
pt26cu126 = ["torch == 2.6.0", "torch-bessel"]
pt27cpu = ["torch == 2.7.1", "torch-bessel"]
pt27cu126 = ["torch == 2.7.1", "torch-bessel"]
pt27cu128 = ["torch == 2.7.1", "torch-bessel"]
pt28cpu = ["torch == 2.8.0", "torch-bessel"]
pt28cu126 = ["torch == 2.8.0", "torch-bessel"]
pt28cu128 = ["torch == 2.8.0", "torch-bessel"]
pt29cpu = ["torch == 2.9.1", "torch-bessel"]
pt29cu126 = ["torch == 2.9.1", "torch-bessel"]
pt29cu128 = ["torch == 2.9.1", "torch-bessel"]
pt210cpu = ["torch == 2.10.0", "torch-bessel"]
pt210cu126 = ["torch == 2.10.0", "torch-bessel"]
pt210cu128 = ["torch == 2.10.0", "torch-bessel"]
pt211cpu = ["torch == 2.11.0", "torch-bessel"]
pt211cu126 = ["torch == 2.11.0", "torch-bessel"]
pt211cu128 = ["torch == 2.11.0", "torch-bessel"]
pt212cpu = ["torch == 2.12.1", "torch-bessel"]
pt212cu126 = ["torch == 2.12.1", "torch-bessel"]
pt212cu130 = ["torch == 2.12.1", "torch-bessel"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
benchmark = [
    "asv",
]
test = [
    "pytest",
    "pytest-cov",
    "packaging",
]
lint = [
    "ruff",
]

[project.urls]
repository = "https://github.com/hchau630/niarb"

[project.scripts]
niarb = "niarb.main:main"

[tool.uv]
required-version = ">=0.6.11"
conflicts = [
    [
        { extra = "pt26cpu" },
        { extra = "pt26cu124" },
