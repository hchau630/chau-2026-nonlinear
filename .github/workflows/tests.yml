# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        extra: [pt26cpu, pt212cpu]
        exclude:
          # Test failure on Ubuntu for torch < 2.9 due to torch.fft.ifftn bug. See
          # https://github.com/pytorch/pytorch/issues/154477
          - os: ubuntu-latest
            extra: pt26cpu
          # Python 3.14 is not supported by torch < 2.9. See
          # https://github.com/pytorch/pytorch/blob/main/RELEASE.md#release-compatibility-matrix
          - python-version: "3.14"
            extra: pt26cpu

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Install uv and Python
      uses: astral-sh/setup-uv@v10.0.0
      with:
        python-version: ${{ matrix.python-version}}

    - name: Install locked dependencies
      run: uv sync --locked --extra ${{ matrix.extra }}

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run --no-sync ruff check . --select=E9,F63,F7,F82
        # exit-zero treats all errors as warnings
        uv run --no-sync ruff check src tests --exit-zero

    - name: Test with pytest
      run: uv run --no-sync pytest --device cpu --cov=src --cov-report=json

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.json
        token: ${{ secrets.CODECOV_TOKEN }}
